
server:
  port: 8082
spring:
  application:
    name: catalog-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: POSTGRESQL
    show-sql: true
    properties:
      hibernate:
        default_schema: catalog

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: catalog
    default-schema: catalog
    baseline-on-migrate: true
  grpc:
    server:
      port: 9091
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8081/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    metadata-map:
      grpc-port: 9091
