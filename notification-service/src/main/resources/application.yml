server:
  port: 8085

spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: POSTGRESQL
    show-sql: false
    properties:
      hibernate:
        default_schema: notification
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: notification
    default-schema: notification
    baseline-on-migrate: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        transport:
          protocol: smtp

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_URL:http://localhost:9000}
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:9000}/oauth2/jwks
      client:
        registration:
          auth-server:
            client-id: notification-service
            client-secret: notification-secret
            authorization-grant-type: client_credentials
        provider:
          auth-server:
            token-uri: ${AUTH_SERVER_URL:http://localhost:9000}/oauth2/token

  grpc:
    server:
      port: 9094

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8081/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    metadata-map:
      grpc-port: 9096

app:
  mail:
    from: ${MAIL_FROM:noreply@rentitup.com}
    from-name: ${MAIL_FROM_NAME:RentItUp}
  sms:
    enabled: ${SMS_ENABLED:false}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}

logging:
  level:
    com.rentitup: DEBUG
