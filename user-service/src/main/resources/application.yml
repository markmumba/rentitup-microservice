
server:
  port: 8082


spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: POSTGRESQL
    show-sql: true
    properties:
      hibernate:
        default_schema: users

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: users
    default-schema: users
    baseline-on-migrate: true
  grpc:
    server:
      port: 9091


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8081/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    metadata-map:
      grpc-port: 9091

jwt:
  secret-key: ${JWT_SECRET_KEY:your-256-bit-secret-key-here-must-be-at-least-32-chars}
  access-token-expiration: 3600000   # 1 hour
  refresh-token-expiration: 604800000 # 7 days
  issuer: rentitup