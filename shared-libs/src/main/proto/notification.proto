syntax = "proto3";
package rentitup.notification;

option java_multiple_files = true;
option java_package = "com.rentitup.shared.proto.notification";
option java_outer_classname = "NotificationProto";

import "common.proto";

enum NotificationChannel {
  CHANNEL_UNSPECIFIED = 0;
  EMAIL = 1;
  SMS = 2;
  PUSH = 3;
}

enum NotificationStatus {
  STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  SENT = 2;
  FAILED = 3;
  DELIVERED = 4;
}

enum NotificationPriority {
  PRIORITY_UNSPECIFIED = 0;
  LOW = 1;
  NORMAL = 2;
  HIGH = 3;
  URGENT = 4;
}


message Notification {
  string id = 1;
  string user_id = 2;
  string recipient = 3;
  NotificationChannel channel = 4;
  string template_key = 5;
  map<string, string> data = 6;
  NotificationStatus status = 7;
  NotificationPriority priority = 8;
  string subject = 9;
  string body = 10;
  string error_message = 11;
  int32 retry_count = 12;
  rentitup.common.Timestamp created_at = 13;
  rentitup.common.Timestamp sent_at = 14;
}


message SendNotificationRequest {
  string recipient = 1;
  NotificationChannel channel = 2;
  string template_key = 3;
  map<string, string> data = 4;
  optional string user_id = 5;
  optional NotificationPriority priority = 6;
}

message SendNotificationResponse {
  string notification_id = 1;
  NotificationStatus status = 2;
  string message = 3;
}

message SendBulkNotificationRequest {
  repeated SendNotificationRequest notifications = 1;
}

message SendBulkNotificationResponse {
  int32 total = 1;
  int32 successful = 2;
  int32 failed = 3;
  repeated SendNotificationResponse results = 4;
}

message BroadcastNotificationRequest {
  repeated string recipients = 1;
  NotificationChannel channel = 2;
  string template_key = 3;
  map<string, string> data = 4;
  optional NotificationPriority priority = 5;
}

message BroadcastNotificationResponse {
  int32 total = 1;
  int32 queued = 2;
  string batch_id = 3;
}

message GetNotificationRequest {
  string notification_id = 1;
}

message GetNotificationResponse {
  Notification notification = 1;
}

message ListNotificationsRequest {
  rentitup.common.PaginationRequest pagination = 1;
  optional string user_id = 2;
  optional NotificationChannel channel = 3;
  optional NotificationStatus status = 4;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
  rentitup.common.PaginationResponse pagination = 2;
}

message RetryNotificationRequest {
  string notification_id = 1;
}

message RetryNotificationResponse {
  bool success = 1;
  string message = 2;
  NotificationStatus new_status = 3;
}


message NotificationTemplate {
  string key = 1;
  string name = 2;
  string description = 3;
  NotificationChannel channel = 4;
  string subject_template = 5;
  string body_template = 6;
  repeated string required_fields = 7;
  bool is_active = 8;
  rentitup.common.Timestamp created_at = 9;
  rentitup.common.Timestamp updated_at = 10;
}

message GetTemplateRequest {
  string key = 1;
  NotificationChannel channel = 2;
}

message GetTemplateResponse {
  NotificationTemplate template = 1;
}

message ListTemplatesRequest {
  optional NotificationChannel channel = 1;
  optional bool active_only = 2;
}

message ListTemplatesResponse {
  repeated NotificationTemplate templates = 1;
}


service NotificationService {
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);

  rpc SendBulkNotification(SendBulkNotificationRequest) returns (SendBulkNotificationResponse);

  rpc BroadcastNotification(BroadcastNotificationRequest) returns (BroadcastNotificationResponse);

  rpc GetNotification(GetNotificationRequest) returns (GetNotificationResponse);

  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse);

  rpc RetryNotification(RetryNotificationRequest) returns (RetryNotificationResponse);

  rpc GetTemplate(GetTemplateRequest) returns (GetTemplateResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
}
