server:
  port: 8080

spring:
  application:
    name: bff

  security:
    oauth2:
      # Resource server - validates incoming user JWTs
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_URL:http://localhost:9000}
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:9000}/oauth2/jwks
      # Client - gets service tokens for public endpoints (e.g., registration)
      client:
        registration:
          auth-server:
            client-id: bff-service
            client-secret: bff-secret
            authorization-grant-type: client_credentials
            scope: internal,user:write,user:read,catalog:read
        provider:
          auth-server:
            token-uri: ${AUTH_SERVER_URL:http://localhost:9000}/oauth2/token

eureka:
  client:
    register-with-eureka: false
    service-url:
      defaultZone: http://localhost:8081/eureka
    fetch-registry: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

