spring:
  application:
    name: bff
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: CONFIG-SERVER
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8081/eureka/}

server:
  servlet:
    session:
      cookie:
        name: BFFSESSION
        http-only: true
        same-site: lax
