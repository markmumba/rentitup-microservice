
server:
  port: 8083

spring:
  application:
    name: catalog-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: POSTGRESQL
    show-sql: true
    properties:
      hibernate:
        default_schema: catalog

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_URL:http://localhost:9000}
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:9000}/oauth2/jwks
      client:
        registration:
          auth-server:
            client-id: catalog-service
            client-secret: catalog-secret
            authorization-grant-type: client_credentials
        provider:
          auth-server:
            token-uri: ${AUTH_SERVER_URL:http://localhost:9000}/oauth2/token

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: catalog
    default-schema: catalog
    baseline-on-migrate: true
  grpc:
    server:
      port: 9092


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8081/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    metadata-map:
      grpc-port: 9092

storage:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:rentitup-images}
  region: ${MINIO_REGION:us-east-1}
  upload-url-expiration-seconds: 3600
