services:
  postgres:
    container_name: machine_app
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${DB_PORT}:5432'
    restart:
      unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data



volumes:
  postgres_data:
