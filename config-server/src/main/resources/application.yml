spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/markmumba/rentitup-configs
          username: ${GITHUB_USERNAME}
          password: ${GITHUB_PASSWORD}


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8081/eureka/}
server:
  port: 8087