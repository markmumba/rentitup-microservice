services:
  postgres:
    container_name: machine_app
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${DB_PORT}:5432'
    restart:
      unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    container_name: minio
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:3000}
    ports:
      - '9001:9000'   # S3 API
      - '9002:9002'   # Console UI
    restart: unless-stopped
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-minioadmin} $${MINIO_SECRET_KEY:-minioadmin};
      mc mb local/$${MINIO_BUCKET:-rentitup-images} --ignore-existing;
      mc anonymous set download local/$${MINIO_BUCKET:-rentitup-images};
      exit 0;
      "

  zipkin:
    image: ghcr.io/openzipkin/zipkin-slim:${TAG:-latest}
    container_name: zipkin
    # Environment settings are defined here https://github.com/openzipkin/zipkin/blob/master/zipkin-server/README.md#environment-variables
    environment:
      - STORAGE_TYPE=mem
      # Uncomment to enable self-tracing
      # - SELF_TRACING_ENABLED=true
      # Uncomment to increase heap size
      # - JAVA_OPTS=-Xms128m -Xmx128m -XX:+ExitOnOutOfMemoryError
    ports:
      # Port used for the Zipkin UI and HTTP Api
      - 9411:9411
    # Uncomment to enable debug logging
    # command: --logging.level.zipkin2=DEBUG
  
  postgres-cache:
    container_name: postgres_cache
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER_CACHE}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_CACHE}
      POSTGRES_DB: ${POSTGRES_DB_CACHE}
    ports:
      - '${DB_PORT_CACHE}:5432'
    restart:
      unless-stopped
    volumes:
      - postgres_cache_data:/var/lib/postgresql/data
      - ./cache_table.sql:/docker-entrypoint-initdb.d/cache_table.sql


volumes:
  postgres_data:
  postgres_cache_data:
  minio_data:
