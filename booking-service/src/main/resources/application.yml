
server:
  port: 8084


spring:
  application:
    name: booking-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    database: POSTGRESQL
    show-sql: true
    properties:
      hibernate:
        default_schema: booking

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: booking
    default-schema: booking
    baseline-on-migrate: true
  grpc:
    server:
      port: 9093

  security:
    oauth2:
      # Resource server - validates incoming JWTs
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_SERVER_URL:http://localhost:9000}
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:9000}/oauth2/jwks
      # Client - gets service tokens for inter-service calls
      client:
        registration:
          auth-server:
            client-id: booking-service
            client-secret: booking-secret
            authorization-grant-type: client_credentials
            scope: internal,user:read,catalog:read
        provider:
          auth-server:
            token-uri: ${AUTH_SERVER_URL:http://localhost:9000}/oauth2/token


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8081/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    metadata-map:
      grpc-port: 9093

