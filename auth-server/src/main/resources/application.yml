server:
  port: ${AUTH_SERVER_PORT:9000}

spring:
  application:
    name: auth-server
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: CONFIG-SERVER

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8081/eureka/}
